name: CI Test, Reporting & GitHub Pages Deployment

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm ci

    - name: Run Jest Unit Tests
      run: npx jest --ci --json --outputFile=test-results.json || true

    - name: Generate JSON Payload & Send to Local Receiver
      run: |
        node -e '
          const fs = require("fs");
          const results = JSON.parse(fs.readFileSync("test-results.json"));
          const report = {
            repositoryName: "${{ github.repository }}",
            branch: "${{ github.ref_name }}",
            commitSHA: "${{ github.sha }}",
            timestamp: new Date().toISOString(),
            totalTests: results.numTotalTests,
            passedTests: results.numPassedTests,
            failedTests: results.numFailedTests,
            overallStatus: results.numFailedTests === 0 ? "PASSED" : "FAILED"
          };
          fs.writeFileSync("final-report.json", JSON.stringify(report, null, 2));
        '
        curl -s -X POST "https://pretty-olives-clean.loca.lt/webhook" \
          -H "Content-Type: application/json" \
          -H "bypass-tunnel-reminder: true" \
          -H "User-Agent: Mozilla/5.0" \
          -d @final-report.json || true

    - name: Upload Static Frontend Artifact for Pages
      if: success()
      uses: actions/upload-pages-artifact@v2
      with:
        path: '.'
    - name: Send Email Report
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "CI Test Report - ${{ github.repository }} (${{ github.sha }})"
        to: "your-email@gmail.com"
        from: "CI Automated Pipeline"
        body: "Test run completed. Check attached report for details."
        attachments: final-report.json

  deploy-pages:
    needs: test-and-report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
        