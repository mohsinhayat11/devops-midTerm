name: CI Test and Local Reporting Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Automated Tests
        id: run_tests
        continue-on-error: true
        run: npx jest --json --outputFile=test-results.json

      - name: Construct and Send Report to Localhost
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let rawResults = {};
            try {
              if (fs.existsSync("test-results.json")) {
                rawResults = JSON.parse(fs.readFileSync("test-results.json", "utf8"));
              }
            } catch (e) {
              console.error("Error reading test-results.json", e);
            }
            
            const totalTests = rawResults.numTotalTests || 0;
            const passedTests = rawResults.numPassedTests || 0;
            const failedTests = rawResults.numFailedTests || 0;
            const overallStatus = (rawResults.success && totalTests > 0) ? "PASSED" : "FAILED";
            
            const individualResults = (rawResults.testResults?.[0]?.assertionResults || []).map(t => ({
              name: t.title,
              status: t.status,
              failureMessage: t.failureMessages?.length > 0 ? t.failureMessages.join("\n") : null
            }));

            const payload = {
              repositoryName: "${{ github.repository }}",
              branch: "${{ github.ref_name }}",
              commitSHA: "${{ github.sha }}",
              pipelineRunId: "${{ github.run_id }}",
              timestamp: new Date().toISOString(),
              totalTests: totalTests,
              passedTests: passedTests,
              failedTests: failedTests,
              overallStatus: overallStatus,
              testDetails: individualResults
            };

            fs.writeFileSync("final-report.json", JSON.stringify(payload, null, 2));
            console.log("Constructed Payload:", JSON.stringify(payload, null, 2));
          '

          # Send Payload with bypass headers to localtunnel
          curl -s -X POST "https://silent-berries-like.loca.lt/webhook" \
            -H "Content-Type: application/json" \
            -H "bypass-tunnel-reminder: true" \
            -H "User-Agent: Mozilla/5.0" \
            -d @final-report.json || true

      - name: Check Final CI Status
        run: |
          if [ "${{ steps.run_tests.outcome }}" != "success" ]; then
            echo "Automated tests failed! Failing CI build..."
            exit 1
          fi